<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#ffffff"/>

  <text x="500" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Innovatech Chile — Arquitectura en AWS ECS Fargate</text>

  <!-- Internet -->
  <ellipse cx="500" cy="85" rx="70" ry="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" fill="#0369a1">Internet</text>

  <line x1="500" y1="113" x2="500" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VPC box -->
  <rect x="60" y="150" width="880" height="580" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" rx="10"/>
  <text x="80" y="175" font-size="13" font-weight="bold" fill="#475569">VPC default (172.31.0.0/16) · Subredes públicas us-east-1a / us-east-1b</text>

  <!-- ALB -->
  <rect x="330" y="195" width="340" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="500" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">innovatech-alb</text>
  <text x="500" y="240" text-anchor="middle" font-size="12" fill="#92400e">Application Load Balancer · Internet-facing</text>
  <text x="500" y="256" text-anchor="middle" font-size="11" fill="#92400e">alb-sg: 80 · 8080 · 8081 (0.0.0.0/0)</text>

  <line x1="410" y1="265" x2="410" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="265" x2="500" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="265" x2="590" y2="300" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="285" text-anchor="middle" font-size="10" fill="#6b7280">:80</text>
  <text x="500" y="285" text-anchor="middle" font-size="10" fill="#6b7280">:8080</text>
  <text x="590" y="285" text-anchor="middle" font-size="10" fill="#6b7280">:8081</text>

  <!-- Target groups -->
  <rect x="330" y="300" width="140" height="34" fill="#e5e7eb" stroke="#6b7280" rx="6"/>
  <text x="400" y="321" text-anchor="middle" font-size="11" fill="#374151">tg-frontend</text>

  <rect x="430" y="300" width="140" height="34" fill="#e5e7eb" stroke="#6b7280" rx="6"/>
  <text x="500" y="321" text-anchor="middle" font-size="11" fill="#374151">tg-ventas</text>

  <rect x="530" y="300" width="140" height="34" fill="#e5e7eb" stroke="#6b7280" rx="6"/>
  <text x="600" y="321" text-anchor="middle" font-size="11" fill="#374151">tg-despachos</text>

  <!-- ECS Cluster box -->
  <rect x="100" y="360" width="800" height="220" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="10"/>
  <text x="120" y="385" font-size="13" font-weight="bold" fill="#3730a3">Clúster ECS — innovatech-cluster (capacity provider: FARGATE)</text>
  <text x="120" y="402" font-size="11" fill="#3730a3">Security Group interno: tasks-sg (solo tráfico desde alb-sg y entre tareas)</text>

  <!-- frontend service -->
  <rect x="140" y="430" width="220" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="2" rx="8"/>
  <text x="250" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">frontend-service</text>
  <text x="250" y="475" text-anchor="middle" font-size="11" fill="#1e40af">React 18 + Vite + Nginx</text>
  <text x="250" y="493" text-anchor="middle" font-size="11" fill="#1e40af">Puerto :80</text>
  <text x="250" y="511" text-anchor="middle" font-size="11" fill="#1e40af">1-2 tasks (Fargate)</text>
  <text x="250" y="529" text-anchor="middle" font-size="10" fill="#3b82f6">VITE_VENTAS_URL / VITE_DESPACHOS_URL</text>

  <!-- ventas service -->
  <rect x="390" y="430" width="220" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="500" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">ventas-service</text>
  <text x="500" y="475" text-anchor="middle" font-size="11" fill="#15803d">Java 21 + Spring Boot 3.4</text>
  <text x="500" y="493" text-anchor="middle" font-size="11" fill="#15803d">Puerto :8080</text>
  <text x="500" y="511" text-anchor="middle" font-size="11" fill="#15803d">Autoscale 1-4 (CPU 50%)</text>
  <text x="500" y="529" text-anchor="middle" font-size="10" fill="#22c55e">healthcheck: /api/v1/ventas</text>

  <!-- despachos service -->
  <rect x="640" y="430" width="220" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="750" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">despachos-service</text>
  <text x="750" y="475" text-anchor="middle" font-size="11" fill="#15803d">Java 21 + Spring Boot 3.4</text>
  <text x="750" y="493" text-anchor="middle" font-size="11" fill="#15803d">Puerto :8081</text>
  <text x="750" y="511" text-anchor="middle" font-size="11" fill="#15803d">Autoscale 1-4 (CPU 50%)</text>
  <text x="750" y="529" text-anchor="middle" font-size="10" fill="#22c55e">healthcheck: /api/v1/despachos</text>

  <!-- lines from target groups to services -->
  <line x1="400" y1="334" x2="250" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="334" x2="500" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="334" x2="750" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- lines ventas/despachos to db -->
  <line x1="500" y1="550" x2="500" y2="650" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="550" x2="510" y2="650" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- MySQL EC2 -->
  <rect x="380" y="655" width="260" height="70" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="8"/>
  <text x="510" y="682" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">EC2 — MySQL 8.0</text>
  <text x="510" y="700" text-anchor="middle" font-size="11" fill="#991b1b">restart: always · puerto 3306</text>
  <text x="510" y="716" text-anchor="middle" font-size="10" fill="#b91c1c">solo accesible desde tasks-sg</text>

  <!-- SSM note -->
  <rect x="660" y="655" width="220" height="70" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" rx="8"/>
  <text x="770" y="678" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b21a8">SSM Parameter Store</text>
  <text x="770" y="696" text-anchor="middle" font-size="10" fill="#6b21a8">/innovatech/db_password</text>
  <text x="770" y="712" text-anchor="middle" font-size="10" fill="#6b21a8">tipo SecureString</text>
  <line x1="660" y1="690" x2="510" y2="690" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="100" y="745" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text x="120" y="757" font-size="10" fill="#374151">Frontend</text>
  <rect x="210" y="745" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="230" y="757" font-size="10" fill="#374151">Backend (Spring Boot)</text>
  <rect x="390" y="745" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="410" y="757" font-size="10" fill="#374151">Base de datos</text>
  <rect x="520" y="745" width="14" height="14" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="540" y="757" font-size="10" fill="#374151">Gestión de secretos</text>
</svg>
